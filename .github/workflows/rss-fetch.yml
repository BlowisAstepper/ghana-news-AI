name: Refresh RSS feed

# Serverless functions have no long-running process to host node-cron, so
# this workflow is the scheduler: it just pings the deployed API route on
# a timer. GitHub disables schedules on repos with no commits for 60 days,
# so this will need a nudge (any commit) if the repo goes fully dormant.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # lets you trigger a fetch manually from the Actions tab

permissions:
  id-token: write

env:
  APP_URL: https://ghana-news-ai-wheat.vercel.app
  OIDC_AUDIENCE: https://ghana-news-ai-wheat.vercel.app/api/rss-fetch

concurrency:
  group: production-rss-refresh
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/rss-fetch
        shell: bash
        run: |
          set -euo pipefail
          encoded_audience=$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')
          response=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")
          token=$(jq --exit-status --raw-output '.value' <<< "$response")
          echo "::add-mask::$token"
          curl --fail-with-body --silent --show-error --max-time 65 \
            --request POST "${APP_URL%/}/api/rss-fetch" \
            --header "Authorization: Bearer $token"
