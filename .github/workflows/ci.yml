name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
        env:
          # A real Postgres URL isn't needed to type-check/build, but Prisma's
          # generated client expects the var to be present.
          DATABASE_URL: 'postgresql://user:password@localhost:5432/ci'
